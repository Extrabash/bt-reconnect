name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # публикация релиза

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Нет секрета SIGNING_KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE" | base64 -d > signing.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: bt-reconnect-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Релиз с тегом v<номер сборки> — его проверяет приложение, чтобы предложить обновление.
      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bt-reconnect.apk
          gh release create "v${{ github.run_number }}" bt-reconnect.apk \
            --target "$GITHUB_SHA" --title "Сборка ${{ github.run_number }}" --generate-notes
