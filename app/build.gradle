plugins {
    id 'com.android.application'
}

// Постоянный ключ подписи: с ним новая сборка ставится поверх старой без удаления.
// Файл в git не хранится — локально лежит в корне проекта, в CI берётся из секрета.
def keystore = rootProject.file('signing.keystore')

android {
    namespace 'com.btreconnect'
    compileSdk 34

    defaultConfig {
        applicationId 'com.btreconnect'
        minSdk 21
        // Намеренно старый targetSdk: не нужны runtime-разрешения
        // и доступно больше скрытых Bluetooth-методов (connect/disconnect).
        targetSdk 27
        // В CI номер сборки = номер запуска workflow; по нему приложение ищет обновления.
        versionCode((project.findProperty('versionCode') ?: 2) as int)
        versionName '1.2'
    }

    signingConfigs {
        fixed {
            if (keystore.exists()) {
                storeFile keystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            // В отлаживаемой сборке Android 9 показывает окно «Detected problems with
            // API compatibility» из-за скрытых Bluetooth-методов.
            debuggable false
            if (keystore.exists()) signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
